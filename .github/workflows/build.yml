name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Test (Chrome is preinstalled on the runner)
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --no-dependencies --out mori-gruvbox-${{ github.ref_name }}.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mozg-theme-extension-vsix
          path: mori-gruvbox-${{ github.ref_name }}.vsix
          if-no-files-found: error

      - name: Attach .vsix to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mori-gruvbox-${{ github.ref_name }}.vsix
